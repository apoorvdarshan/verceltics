version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
  # Hash-locked store tooling (requirements-store.in → requirements-store.txt) that
  # release jobs install next to the App Store Connect and Google Play credentials.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  # Swift packages resolved by the Xcode project
  # (ios/verceltics.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved).
  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: weekly
