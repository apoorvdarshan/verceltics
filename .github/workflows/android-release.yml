# Android release — GitHub Actions builds, verifies and signs the Android app,
# publishes it on Google Play when switched on, and then on GitHub Releases.
#
# Trigger
#   push tag android-vX.Y   release run (the tag must equal versionName in
#                           android/app/build.gradle.kts). iOS uses ios-v* tags
#                           (ios-release.yml), so the two pipelines never collide.
#   workflow_dispatch       validation run: build the signed AAB and APK and
#                           verify package, version and upload-key signature.
#                           Never contacts Google Play, uploads, signs with
#                           Sigstore or releases.
#
# Switches (repository Variables; missing = off, invalid values fail the run).
# See store/README.md for the full table.
#   ANDROID_RELEASE_AUTOMATION   master switch: off = a tag builds and releases nothing
#   ANDROID_UPLOAD_LISTING       Play title and descriptions (store/metadata/play)
#   ANDROID_UPLOAD_WHATS_NEW     What's New on this run's Play release (needs a track)
#   ANDROID_UPLOAD_SCREENSHOTS   Play phone screenshots
#   ANDROID_INTERNAL_TESTING     upload this build to Play internal testing
#   ANDROID_CLOSED_TESTING       upload this build to Play closed testing (alpha track)
#   ANDROID_PRODUCTION_ROLLOUT   upload this build to Play production, live. Google has
#                                not granted Verceltics production access yet (12 testers
#                                in closed testing for 14 days), so Play rejects it until then.
# Every enabled track receives the same upload in one Play edit; testing tracks
# never imply production, and the upload never runs without a track.
#
# Order of a release run (master on):
#   gates     switches, reviewed notes, and a read-only Play check that versionCode
#             is higher than every versionCode Google Play has (before CI or build)
#   quality   ci.yml: catalog and store release tests, Android unit tests, lint,
#             builds and both emulator test shards (not the website/Worker job, and
#             only the store assets this run uploads are checked)
#   release   build, verify (pinned upload certificate), Sigstore + provenance,
#             Play listing/screenshots, Play upload, read every track back, and
#             only then the GitHub Release
# "Re-run failed jobs" is safe: the Play upload is skipped when an earlier attempt
# already put this versionCode on every selected track, and an existing GitHub
# Release for the tag is updated instead of failing.
#
# Secrets
#   ANDROID_KEYSTORE_BASE64     base64 of the upload keystore (alias "upload"); its
#                               certificate must match EXPECTED_UPLOAD_CERT_SHA256 in
#                               scripts/store/android_release.py
#   ANDROID_KEYSTORE_PASSWORD   its password, which is also the key password
#   PLAY_SERVICE_ACCOUNT_JSON   a Play publisher service-account JSON key with
#                               access to com.apoorvdarshan.verceltics
#
# versionCode discipline stays in the repo: bump it in app/build.gradle.kts
# BEFORE tagging — Play rejects a versionCode it has already seen, and gates
# fails first when Play already has it.
#
# Supply-chain: the AAB/APK attached to the GitHub Release are signed keylessly
# with Sigstore cosign (a *.sigstore.json bundle per artifact) and carry a
# GitHub build-provenance attestation. Verify a download with:
#   cosign verify-blob verceltics-android-X.Y-N.apk --bundle verceltics-android-X.Y-N.apk.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/apoorvdarshan/verceltics/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify verceltics-android-X.Y-N.apk --repo apoorvdarshan/verceltics

name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: read

# Tag release runs never overlap. Manual validation runs get their own group and
# can never cancel a release run.
concurrency:
  group: android-release-${{ github.event_name == 'push' && 'release' || github.run_id }}
  cancel-in-progress: false
  # Keep every waiting tag run queued; the default (single) would cancel an older pending run.
  queue: max

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.gates.outputs.mode }}
      build: ${{ steps.gates.outputs.build }}
      github_release: ${{ steps.gates.outputs.github_release }}
      listing: ${{ steps.gates.outputs.listing }}
      whats_new: ${{ steps.gates.outputs.whats_new }}
      screenshots: ${{ steps.gates.outputs.screenshots }}
      production: ${{ steps.gates.outputs.production }}
      play_upload: ${{ steps.gates.outputs.play_upload }}
      play_tracks: ${{ steps.gates.outputs.play_tracks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/store/
            /scripts/release_notes.py
            /android/app/build.gradle.kts
            /requirements-store.txt
            /RELEASE_NOTES.md

      - name: Resolve Android release switches
        id: gates
        env:
          ANDROID_RELEASE_AUTOMATION: ${{ vars.ANDROID_RELEASE_AUTOMATION }}
          ANDROID_UPLOAD_LISTING: ${{ vars.ANDROID_UPLOAD_LISTING }}
          ANDROID_UPLOAD_WHATS_NEW: ${{ vars.ANDROID_UPLOAD_WHATS_NEW }}
          ANDROID_UPLOAD_SCREENSHOTS: ${{ vars.ANDROID_UPLOAD_SCREENSHOTS }}
          ANDROID_INTERNAL_TESTING: ${{ vars.ANDROID_INTERNAL_TESTING }}
          ANDROID_CLOSED_TESTING: ${{ vars.ANDROID_CLOSED_TESTING }}
          ANDROID_PRODUCTION_ROLLOUT: ${{ vars.ANDROID_PRODUCTION_ROLLOUT }}
        run: python3 scripts/store/android_release.py gates

      # Fail before the long quality run when the notes are malformed, or when What's New
      # is switched on without notes that fit Google Play.
      - name: Check reviewed release notes
        if: steps.gates.outputs.github_release == 'true'
        env:
          WHATS_NEW: ${{ steps.gates.outputs.whats_new }}
        run: |
          python3 scripts/release_notes.py --if-present "$GITHUB_REF_NAME" > /dev/null
          if [ "$WHATS_NEW" = true ]; then
            python3 scripts/store/play_listing.py whats-new --tag "$GITHUB_REF_NAME" > /dev/null
          fi

      - name: Set up Python
        if: steps.gates.outputs.github_release == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install store tooling
        if: steps.gates.outputs.github_release == 'true'
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      # Read-only (a throwaway Play edit that is deleted, never committed): Play rejects a
      # versionCode it has seen, and a GitHub Release must never label a different binary
      # with a versionCode Play already has. Runs once per run: "Re-run failed jobs" does
      # not repeat it after this run's own upload.
      - name: Check versionCode is new on Google Play (read-only)
        if: steps.gates.outputs.github_release == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 -u scripts/store/android_release.py check-version-code

  quality:
    needs: gates
    if: needs.gates.outputs.mode == 'release' && needs.gates.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      android-release: true
    permissions:
      contents: read

  release:
    needs: [gates, quality]
    # Validation runs skip quality; release runs need it to pass.
    if: >-
      !cancelled() && needs.gates.result == 'success' && needs.gates.outputs.build == 'true' &&
      (needs.quality.result == 'success' ||
       (needs.gates.outputs.mode == 'validate' && needs.quality.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create or update the GitHub Release
      id-token: write # Sigstore keyless signing + provenance (OIDC token)
      attestations: write # store the build-provenance attestation
    env:
      RELEASE_RUN: ${{ needs.gates.outputs.mode == 'release' }}
    steps:
      # Fail fast and clearly, before any build, when signing is not set up.
      - name: Check upload keystore secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "error: upload keystore secrets are not configured: set ${missing[*]} in Settings → Secrets and variables → Actions (see store/README.md)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            android
            scripts
            store

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Store tooling runs in this pinned Python, never the runner's system Python.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Only the store assets this run uploads are checked, so an unused listing or
      # screenshot never blocks a release.
      - name: Validate the IAP catalog, and the Play listing and screenshots this run uploads
        env:
          LISTING: ${{ needs.gates.outputs.listing }}
          SCREENSHOTS: ${{ needs.gates.outputs.screenshots }}
        run: |
          python3 scripts/store/validate_catalog.py --platform android
          flags=()
          if [ "$LISTING" = true ]; then flags+=(--listing); fi
          if [ "$SCREENSHOTS" = true ]; then flags+=(--screenshots); fi
          if [ "${#flags[@]}" -gt 0 ]; then
            python3 scripts/store/play_listing.py check "${flags[@]}"
          fi

      - name: Prepare reviewed release notes, What's New + listing text (local only)
        if: env.RELEASE_RUN == 'true'
        env:
          WHATS_NEW: ${{ needs.gates.outputs.whats_new }}
          LISTING: ${{ needs.gates.outputs.listing }}
        run: |
          python3 scripts/release_notes.py --if-present "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          # The notes become Play What's New only when ANDROID_UPLOAD_WHATS_NEW is on,
          # and the listing is read only when ANDROID_UPLOAD_LISTING is on.
          args=(--out "$RUNNER_TEMP/store-meta")
          if [ "$WHATS_NEW" = true ]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          if [ "$LISTING" != true ]; then args+=(--no-listing); fi
          python3 scripts/store/play_listing.py prepare "${args[@]}"

      # Signing material lives only under $RUNNER_TEMP, readable by this user alone,
      # and is removed right after the build is verified.
      - name: Materialize upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/upload-password"

      - name: Build signed AAB + APK
        working-directory: android
        # Store artifacts are always built fresh, never from cached task outputs.
        run: |
          ./gradlew --no-build-cache :app:bundleRelease :app:assembleRelease \
            -PVERCELTICS_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" \
            -PVERCELTICS_UPLOAD_KEYSTORE_PASSWORD_FILE="$RUNNER_TEMP/upload-password"

      # The keystore's certificate must be the pinned Play upload certificate, and the
      # AAB and APK must be signed by it alone.
      - name: Verify package, version and upload-key signature
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUNDLETOOL_VERSION: "1.18.3"
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          echo "${BUNDLETOOL_SHA256}  $RUNNER_TEMP/bundletool.jar" | sha256sum -c -
          python3 scripts/store/android_release.py verify \
            --aab android/app/build/outputs/bundle/release/app-release.aab \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --keystore "$RUNNER_TEMP/upload.jks" \
            --alias upload \
            --bundletool "$RUNNER_TEMP/bundletool.jar"

      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/upload-password"

      - name: Stage release artifacts
        id: artifacts
        if: env.RELEASE_RUN == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          CODE=$(grep -m1 'versionCode = ' android/app/build.gradle.kts | tr -dc '0-9')
          NAME="verceltics-android-${VERSION}-${CODE}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/${NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/${NAME}.apk"
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.RELEASE_RUN == 'true'

      - name: Sign release artifacts (Sigstore keyless)
        if: env.RELEASE_RUN == 'true'
        working-directory: ${{ runner.temp }}/dist
        run: |
          for artifact in *.aab *.apk; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done
          ls -l

      - name: Attest build provenance
        if: env.RELEASE_RUN == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.aab
            ${{ runner.temp }}/dist/*.apk

      - name: Install store tooling
        if: >-
          needs.gates.outputs.listing == 'true' || needs.gates.outputs.screenshots == 'true' ||
          needs.gates.outputs.play_upload == 'true'
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      - name: Play listing / screenshots upload
        if: needs.gates.outputs.listing == 'true' || needs.gates.outputs.screenshots == 'true'
        env:
          UPLOAD_LISTING: ${{ needs.gates.outputs.listing }}
          UPLOAD_SCREENSHOTS: ${{ needs.gates.outputs.screenshots }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 -u scripts/store/play_listing.py upload --metadata-dir "$RUNNER_TEMP/store-meta"

      # Read-only. Fails without a valid track list (the upload action would otherwise
      # fall back to production) and when Play holds this versionCode on only some of
      # the selected tracks. uploaded=true means an earlier attempt of this run already
      # put it on every selected track, so it is not uploaded again.
      - name: Check this versionCode on the selected Play tracks (read-only)
        id: play_state
        if: needs.gates.outputs.play_upload == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACKS: ${{ needs.gates.outputs.play_tracks }}
        run: python3 -u scripts/store/android_release.py play-state --tracks "$PLAY_TRACKS"

      - name: Keep English What's New only
        if: >-
          needs.gates.outputs.play_upload == 'true' && needs.gates.outputs.whats_new == 'true' &&
          steps.play_state.outputs.uploaded == 'false'
        run: |
          NOTES="$RUNNER_TEMP/store-meta/play/whatsnew-en-US"
          if [ ! -s "$NOTES" ]; then
            echo "error: ANDROID_UPLOAD_WHATS_NEW is on, but whatsnew-en-US is missing" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/whats-new"
          cp "$NOTES" "$RUNNER_TEMP/whats-new/"

      # Never runs without a track: with an empty track list the action uploads to production.
      - name: Upload to Play (${{ needs.gates.outputs.play_tracks }})
        if: >-
          needs.gates.outputs.play_upload == 'true' && needs.gates.outputs.play_tracks != '' &&
          steps.play_state.outputs.uploaded == 'false' && needs.gates.outputs.whats_new != 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apoorvdarshan.verceltics
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ needs.gates.outputs.play_tracks }}
          status: completed

      - name: Upload to Play with What's New (${{ needs.gates.outputs.play_tracks }})
        if: >-
          needs.gates.outputs.play_upload == 'true' && needs.gates.outputs.play_tracks != '' &&
          steps.play_state.outputs.uploaded == 'false' && needs.gates.outputs.whats_new == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apoorvdarshan.verceltics
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ needs.gates.outputs.play_tracks }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whats-new

      - name: Confirm each Play track now carries this build
        if: needs.gates.outputs.play_upload == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACKS: ${{ needs.gates.outputs.play_tracks }}
        run: python3 -u scripts/store/android_release.py check-tracks --tracks "$PLAY_TRACKS"

      - name: Play upload (skipped)
        if: needs.gates.outputs.play_upload != 'true'
        run: echo "No Play track selected — nothing was uploaded to Google Play"

      # Last, so a GitHub Release only ever describes a build that reached every
      # selected Play track. A rerun updates the release this run already created
      # (title, notes, assets) instead of failing.
      - name: Create or update the GitHub Release
        if: needs.gates.outputs.github_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.artifacts.outputs.name }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          CODE: ${{ steps.artifacts.outputs.code }}
          PRODUCTION: ${{ needs.gates.outputs.production }}
        run: |
          set -euo pipefail
          title="Android ${VERSION} (versionCode ${CODE})"
          assets=("$RUNNER_TEMP/dist/${NAME}.aab" "$RUNNER_TEMP/dist/${NAME}.aab.sigstore.json"
                  "$RUNNER_TEMP/dist/${NAME}.apk" "$RUNNER_TEMP/dist/${NAME}.apk.sigstore.json")
          # A prerelease while Android ships only to testing tracks, so the iOS release stays latest.
          if [ "$PRODUCTION" = true ]; then
            kind=(--prerelease=false --latest)
          else
            kind=(--prerelease --latest=false)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            notes=()
            if [ -s "$RUNNER_TEMP/release-notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/release-notes.md"); fi
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" \
              --title "$title" "${notes[@]}"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
            echo "updated the existing GitHub Release $GITHUB_REF_NAME"
          else
            if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
              notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag "${kind[@]}" \
              --title "$title" "${notes[@]}" "${assets[@]}"
          fi
