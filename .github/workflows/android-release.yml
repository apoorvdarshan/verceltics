name: Android Release

# Setup only until STORE_ANDROID_RELEASE_ENABLED is explicitly enabled.
# An android-v* tag then tests and builds a signed AAB and APK, signs them with Sigstore,
# attests their provenance, and creates a GitHub prerelease. Google Play is touched only when
# STORE_PLAY_TRACK names a testing track (internal or closed). Production is not supported yet.
# See store/README.md for the switches and the three secrets this job needs.
on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-store-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.STORE_ANDROID_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore keyless signing and provenance
      attestations: write # store the build provenance attestation
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate version, products, and reviewed release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/store/validate_android_release.py --tag "$TAG" --whats-new-dir "$RUNNER_TEMP/whats-new"
          python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Print and normalize Android store switches
        id: gates
        env:
          STORE_ANDROID_RELEASE_ENABLED: ${{ vars.STORE_ANDROID_RELEASE_ENABLED }}
          STORE_PLAY_TRACK: ${{ vars.STORE_PLAY_TRACK }}
          STORE_UPLOAD_WHATS_NEW: ${{ vars.STORE_UPLOAD_WHATS_NEW }}
        run: python3 scripts/store/print_android_gates.py --github-output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Reject modified or unrecognized wrapper JARs before running Gradle.
          validate-wrappers: true

      - name: Install the Android platform
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" || \
            "${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-37.0" || \
            true

      - name: Materialize the upload keystore
        env:
          VERCELTICS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.VERCELTICS_UPLOAD_KEYSTORE_BASE64 }}
          VERCELTICS_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.VERCELTICS_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$VERCELTICS_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$VERCELTICS_UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "error: set the VERCELTICS_UPLOAD_KEYSTORE_BASE64 and VERCELTICS_UPLOAD_KEYSTORE_PASSWORD secrets" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$VERCELTICS_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$VERCELTICS_UPLOAD_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/upload-password"

      - name: Test and build the signed AAB and APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          ./gradlew --no-daemon testDebugUnitTest :app:bundleRelease :app:assembleRelease \
            -PVERCELTICS_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks" \
            -PVERCELTICS_UPLOAD_KEYSTORE_PASSWORD_FILE="$RUNNER_TEMP/upload-password"

      - name: Remove the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/upload-password"

      - name: Stage release artifacts
        id: artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#android-v}"
          CODE=$(grep -m1 'versionCode = ' android/app/build.gradle.kts | tr -dc '0-9')
          NAME="verceltics-android-${VERSION}-${CODE}"
          mkdir -p "$RUNNER_TEMP/dist"
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/${NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dist/${NAME}.apk"
          # Builds without the keystore properties stay unsigned; Play would reject them.
          jarsigner -verify "$RUNNER_TEMP/dist/${NAME}.aab" | grep -q "jar verified" || {
            echo "error: the AAB is not signed with the upload key" >&2
            exit 1
          }
          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
            echo "code=${CODE}"
          } >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts (Sigstore keyless)
        working-directory: ${{ runner.temp }}/dist
        run: |
          for artifact in *.aab *.apk; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "$artifact"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*.aab
            ${{ runner.temp }}/dist/*.apk

      - name: Upload to a Google Play testing track
        if: steps.gates.outputs.play_upload == 'true' && steps.gates.outputs.upload_whats_new != 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apoorvdarshan.verceltics
          releaseFiles: ${{ runner.temp }}/dist/${{ steps.artifacts.outputs.name }}.aab
          tracks: ${{ steps.gates.outputs.play_track }}
          status: completed

      - name: Upload to a Google Play testing track (with What's New)
        if: steps.gates.outputs.play_upload == 'true' && steps.gates.outputs.upload_whats_new == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apoorvdarshan.verceltics
          releaseFiles: ${{ runner.temp }}/dist/${{ steps.artifacts.outputs.name }}.aab
          tracks: ${{ steps.gates.outputs.play_track }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whats-new

      - name: Google Play upload (skipped)
        if: steps.gates.outputs.play_upload != 'true'
        run: echo "Google Play upload skipped (STORE_PLAY_TRACK is none)"

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.artifacts.outputs.name }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          CODE: ${{ steps.artifacts.outputs.code }}
        run: |
          # A prerelease while Android ships only to testing tracks, so the iOS release stays latest.
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title "Android ${VERSION} (versionCode ${CODE})" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$RUNNER_TEMP/dist/${NAME}.aab" "$RUNNER_TEMP/dist/${NAME}.aab.sigstore.json" \
            "$RUNNER_TEMP/dist/${NAME}.apk" "$RUNNER_TEMP/dist/${NAME}.apk.sigstore.json"
