name: Validate store setup

# Local metadata checks only. No app build, credentials, or store API calls.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate local catalog and listing
        run: |
          python3 scripts/store/validate_ios_release.py
          python3 scripts/store/prepare_ios_metadata.py --out "$RUNNER_TEMP/store-meta"
          UPLOAD_LISTING=true python3 scripts/store/asc_release.py --dry-run --metadata-dir "$RUNNER_TEMP/store-meta"
          python3 scripts/store/validate_android_release.py
      - name: Show configured switches
        env:
          STORE_IOS_RELEASE_ENABLED: ${{ vars.STORE_IOS_RELEASE_ENABLED }}
          STORE_UPLOAD_LISTING: ${{ vars.STORE_UPLOAD_LISTING }}
          STORE_UPLOAD_SCREENSHOTS: ${{ vars.STORE_UPLOAD_SCREENSHOTS }}
          STORE_SUBMIT_IOS_REVIEW: ${{ vars.STORE_SUBMIT_IOS_REVIEW }}
        run: python3 scripts/store/print_gates.py
      - name: Show configured Android switches
        env:
          STORE_ANDROID_RELEASE_ENABLED: ${{ vars.STORE_ANDROID_RELEASE_ENABLED }}
          STORE_PLAY_TRACK: ${{ vars.STORE_PLAY_TRACK }}
          STORE_UPLOAD_WHATS_NEW: ${{ vars.STORE_UPLOAD_WHATS_NEW }}
        run: python3 scripts/store/print_android_gates.py
