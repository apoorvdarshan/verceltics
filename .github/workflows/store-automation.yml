# Store automation dry-run: tests the release scripts and validates the store
# metadata, screenshots and product catalog. Uses no credentials and never
# contacts App Store Connect or Google Play. Safe to run anytime.
#
# Jobs
#   dry-run         offline release-script tests, store asset checks and publisher
#                   dry-runs, with no third-party packages installed; it also
#                   installs the pinned App Store Connect CLI (asc) the iOS release
#                   uses and checks its version, so a bad pin fails here
#   store-tooling   installs the hash-locked store tooling (requirements-store.txt)
#                   that release jobs install, into the same pinned Python, and
#                   uses it offline: pinned versions, the Google Play API client
#                   and the RGB copies of App Store screenshots that store alpha
#                   (Pillow). A Dependabot pip update only changes
#                   requirements-store.in/.txt, so this job is what checks it
#                   before it is merged, instead of the next release tag.
#
# Live store operations stay behind the repository Variables documented in
# store/README.md and store/gates.env.example (all off by default).

name: Store automation (dry-run)

on:
  push:
    branches: [main]
    paths:
      - "store/**"
      - "scripts/store/**"
      - "scripts/release_notes.py"
      - "RELEASE_NOTES.md"
      - "requirements-store.in"
      - "requirements-store.txt"
      - "ios/verceltics.xcodeproj/project.pbxproj"
      - "ios/verceltics/Paywall/Products.storekit"
      - "android/app/build.gradle.kts"
      - "android/app/src/main/java/com/apoorvdarshan/verceltics/billing/BillingModels.kt"
      - ".github/workflows/store-automation.yml"
      - ".github/workflows/ios-release.yml"
      - ".github/workflows/android-release.yml"
  pull_request:
    paths:
      - "store/**"
      - "scripts/store/**"
      - "scripts/release_notes.py"
      - "RELEASE_NOTES.md"
      - "requirements-store.in"
      - "requirements-store.txt"
      - "ios/verceltics.xcodeproj/project.pbxproj"
      - "ios/verceltics/Paywall/Products.storekit"
      - "android/app/build.gradle.kts"
      - "android/app/src/main/java/com/apoorvdarshan/verceltics/billing/BillingModels.kt"
      - ".github/workflows/store-automation.yml"
      - ".github/workflows/ios-release.yml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-dry-run-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /store/
            /RELEASE_NOTES.md
            /requirements-store.txt
            /ios/verceltics.xcodeproj/
            /ios/verceltics/Paywall/Products.storekit
            /android/app/build.gradle.kts
            /android/app/src/main/java/com/apoorvdarshan/verceltics/billing/BillingModels.kt
            /.github/workflows/ios-release.yml
            /.github/workflows/store-automation.yml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Print store switches (must stay safe by default)
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_CREATE_PRODUCTS: ${{ vars.IOS_CREATE_PRODUCTS }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_UPLOAD_CREATIVE_ASSETS: ${{ vars.IOS_UPLOAD_CREATIVE_ASSETS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
          ANDROID_RELEASE_AUTOMATION: ${{ vars.ANDROID_RELEASE_AUTOMATION }}
          ANDROID_UPLOAD_LISTING: ${{ vars.ANDROID_UPLOAD_LISTING }}
          ANDROID_UPLOAD_WHATS_NEW: ${{ vars.ANDROID_UPLOAD_WHATS_NEW }}
          ANDROID_UPLOAD_SCREENSHOTS: ${{ vars.ANDROID_UPLOAD_SCREENSHOTS }}
          ANDROID_INTERNAL_TESTING: ${{ vars.ANDROID_INTERNAL_TESTING }}
          ANDROID_CLOSED_TESTING: ${{ vars.ANDROID_CLOSED_TESTING }}
          ANDROID_PRODUCTION_ROLLOUT: ${{ vars.ANDROID_PRODUCTION_ROLLOUT }}
        run: python3 scripts/store/print_gates.py --platform all

      - name: Test iOS release switches, build wait, listing and review (offline)
        run: python3 -m unittest -v scripts/store/test_ios_release.py

      - name: Test Android release switches, artifact checks, Play listing and read-back (offline)
        run: python3 -m unittest -v scripts/store/test_android_release.py

      - name: Check the repository's store listings and screenshots
        run: python3 -m unittest -v scripts/store/test_store_assets.py

      - name: Validate the product catalog, App Store listing and Play listing
        run: |
          python3 scripts/store/validate_catalog.py --platform all
          python3 scripts/store/ios_metadata.py check
          python3 scripts/store/play_listing.py check

      # Proves the pinned release still downloads and matches its checksum.
      - name: Install and check the pinned App Store Connect CLI (no store calls)
        run: |
          python3 scripts/store/asc_cli.py install --dest "$RUNNER_TEMP/asc-bin"
          PATH="$RUNNER_TEMP/asc-bin:$PATH" python3 scripts/store/asc_cli.py check

      - name: Prepare store metadata and dry-run the publishers (no store APIs)
        run: |
          python3 scripts/store/ios_metadata.py prepare --out "$RUNNER_TEMP/store-meta" --tag ios-v2.1
          python3 scripts/store/play_listing.py prepare --out "$RUNNER_TEMP/store-meta" --tag android-v1.0
          UPLOAD_LISTING=true UPLOAD_WHATS_NEW=true UPLOAD_SCREENSHOTS=true SUBMIT_IOS_REVIEW=true \
            python3 scripts/store/asc_release.py --dry-run --metadata-dir "$RUNNER_TEMP/store-meta" \
            --build-id DRY-RUN --build-number 1
          # With IOS_UPLOAD_LISTING off a release prepares only What's New and never reads the listing.
          python3 scripts/store/ios_metadata.py prepare --out "$RUNNER_TEMP/store-meta-whats-new" \
            --tag ios-v2.1 --no-listing
          UPLOAD_WHATS_NEW=true \
            python3 scripts/store/asc_release.py --dry-run --metadata-dir "$RUNNER_TEMP/store-meta-whats-new"
          UPLOAD_LISTING=true UPLOAD_SCREENSHOTS=true \
            python3 scripts/store/play_listing.py upload --dry-run --metadata-dir "$RUNNER_TEMP/store-meta"
          python3 scripts/store/ios_release.py --help > /dev/null
          python3 scripts/store/asc_products.py --help > /dev/null
          python3 scripts/store/asc_products.py create  # CREATE_IOS_PRODUCTS unset: skipped, no calls
          python3 scripts/store/android_release.py --help > /dev/null

      - name: Upload prepared metadata (inspection only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-metadata-dry-run-${{ github.run_attempt }}
          path: ${{ runner.temp }}/store-meta
          if-no-files-found: error
          retention-days: 7

  # Release jobs install requirements-store.txt next to the store credentials, and
  # nothing else on a pull request does, so a Dependabot pip update is installed
  # and used here: exactly as the release jobs install it, then offline.
  store-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/store/
            /scripts/release_notes.py
            /store/catalog/
            /requirements-store.in
            /requirements-store.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install store tooling (hash-locked, as the release jobs do)
        run: |
          python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt
          python3 -m pip check

      - name: Use it offline (pinned versions, Play API client)
        run: python3 -u scripts/store/check_store_tooling.py

      # iOS release runs upload RGB copies, made with Pillow, of screenshots that
      # store alpha; with STORE_TESTS_NEED_PILLOW these tests cannot skip.
      - name: Test the screenshot RGB copies with Pillow (offline)
        env:
          STORE_TESTS_NEED_PILLOW: "1"
        run: python3 -m unittest -v -k ScreenshotRgbCopy scripts/store/test_ios_release.py
