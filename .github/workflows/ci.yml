name: CI

# Python checks (API catalogs, privacy manifest, AuthManager), the website and
# Worker, and the Android app (unit tests, lint, Debug and unsigned Release builds,
# and instrumentation tests on an emulator). iOS tests run in ios-tests.yml; the
# store data is checked by store-checks.yml (apoorvdarshan/store-release).
on:
  # PR branches are checked by pull_request; push covers main only, so a PR's
  # checks do not run twice.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  # android-release.yml runs these checks before a tagged release.
  workflow_call:
    inputs:
      android-release:
        description: >-
          Set by android-release.yml. Runs every check that covers the Android app
          (catalog tests, Android unit tests, lint, builds and emulator tests) but
          not the website/Worker job: a website dependency advisory never blocks
          the release, and store-release checks the store assets the release
          uploads. Pull requests and main always run everything.
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Pushes to main,
# manual runs, and release callers each keep their own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run only the jobs their files can affect (a skipped job is not
  # a failure). Pushes to main, manual runs, and release callers run everything
  # (android-release.yml leaves out the web job; see the input above).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      catalog: ${{ steps.filter.outputs.catalog }}
      web: ${{ steps.filter.outputs.web }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      # Trees only (no file contents): enough for git diff --name-only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all() { for job in catalog web android; do echo "$job=true" >> "$GITHUB_OUTPUT"; done; }
          [ "$EVENT" = "pull_request" ] || { all; exit 0; }
          # pull_request checks out the PR merged into its base, so parent 1 is the base.
          # --no-renames: a moved file counts for both its old and new folder.
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD) || { all; exit 0; }
          printf '%s\n' "$files"
          match() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          {
            # The catalog tests read the iOS catalogs, privacy manifest, and account code.
            echo "catalog=$(match '^"?(tests/|scripts/|ios/verceltics/|\.github/workflows/ci\.yml)')"
            echo "web=$(match '^"?(web/|\.github/workflows/ci\.yml)')"
            # Android unit tests compare the bundled API catalogs with the iOS copies.
            echo "android=$(match '^"?(android/|ios/verceltics/Resources/|scripts/ci/wait_for_emulator_idle\.sh|\.github/workflows/ci\.yml)')"
          } >> "$GITHUB_OUTPUT"

  catalog:
    needs: changes
    # Runs if the filter failed, so a broken filter can never skip the check.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.catalog == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # Only what scripts/test.sh reads.
          sparse-checkout: |
            /tests/
            /scripts/
            /ios/verceltics/Resources/
            /ios/verceltics/PrivacyInfo.xcprivacy
            /ios/verceltics/Auth/AuthManager.swift

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Catalog integrity tests
        env:
          RELEASE_GATE: ${{ inputs.android-release }}
        run: |
          if [ "$RELEASE_GATE" = true ]; then
            ./scripts/test.sh --release-gate
          else
            ./scripts/test.sh
          fi

  web:
    needs: changes
    # Never part of an Android release gate: the website and Worker are not in the app.
    if: ${{ !cancelled() && !inputs.android-release && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: web
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit all web dependencies
        working-directory: web
        run: npm audit --audit-level=moderate

      - name: Test web worker
        working-directory: web
        run: npm run test:worker

      - name: Fuzz web worker
        working-directory: web
        run: npm run test:fuzz

      - name: Build website
        working-directory: web
        run: npm run build

  android:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          # ProviderApiCatalogParserTest and CloudflareOpenApiCatalogTest compare the
          # Android assets with the iOS catalogs.
          sparse-checkout: |
            /android/
            /ios/verceltics/Resources/
          persist-credentials: false

      # Verifies android/gradle/wrapper/gradle-wrapper.jar against Gradle's
      # published checksums, so a tampered wrapper binary fails CI.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Default packages include obsolete `tools`, which sdkmanager no longer ships.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0

      # Caches dependencies and compiled task outputs. Unit test results are never
      # restored from it (see android/app/build.gradle.kts), so tests always run.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No signing or store credentials are available here. The unsigned,
      # minified Release APK catches R8 and packaging regressions before tagging.
      - name: Unit tests, lint, Debug APK, and unsigned Release APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: Retain test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports-${{ github.run_attempt }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

  android-instrumentation:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every test still runs exactly once: AndroidJUnitRunner splits the ~310 tests across
    # two emulators (one emulator took about 9 minutes for the suite).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      TEST_SHARDS: 2
      TEST_SHARD: ${{ matrix.shard }}
      # The emulator, defined once: both emulator steps use it, and so does the snapshot
      # cache key, so changing any of it makes a new snapshot.
      EMULATOR_API: 36
      EMULATOR_TARGET: google_apis
      EMULATOR_ARCH: x86_64
      EMULATOR_PROFILE: pixel_2
      EMULATOR_CORES: 4
      EMULATOR_RAM: 4096M
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            android
            scripts/ci
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Debug app and instrumentation APKs
        working-directory: android
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-test-logs"
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-test-logs/build.log"

      - name: Prepare test command and diagnostics
        run: |
          cat > "$RUNNER_TEMP/run-android-instrumentation.sh" <<'SH'
          #!/bin/bash
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-test-logs"
          capture_diagnostics() {
            adb logcat -d > "$RUNNER_TEMP/android-test-logs/logcat.txt" 2>&1 || true
            adb shell dumpsys activity activities > "$RUNNER_TEMP/android-test-logs/activities.txt" 2>&1 || true
          }
          trap capture_diagnostics EXIT
          # The restored snapshot catches up on the time it was saved; let that settle.
          bash "$GITHUB_WORKSPACE/scripts/ci/wait_for_emulator_idle.sh"
          adb logcat -c
          ./gradlew :app:connectedDebugAndroidTest --stacktrace \
            -Pandroid.testInstrumentationRunnerArguments.numShards="$TEST_SHARDS" \
            -Pandroid.testInstrumentationRunnerArguments.shardIndex="$TEST_SHARD" \
            2>&1 | tee "$RUNNER_TEMP/android-test-logs/instrumentation.log"
          # A shard that ran nothing would hide a broken split or setup; fail instead.
          ran=$(find app/build/outputs/androidTest-results/connected -name '*.xml' -exec grep -ho '<testcase ' {} + 2>/dev/null | wc -l | tr -d ' ')
          echo "shard $TEST_SHARD of $TEST_SHARDS ran $ran test(s)"
          [ "$ran" -gt 0 ] || { echo "error: shard $TEST_SHARD ran no tests" >&2; exit 1; }
          SH

      # The snapshot only loads with the emulator, system image, runner OS and settings
      # it was made with. Install the emulator and image first and put their versions,
      # the runner image and a hash of the settings in the cache key, so any change makes
      # a new snapshot instead of silently cold-booting an old one.
      - name: Install the emulator and system image, and key the snapshot on them
        id: avd-key
        run: |
          set -euo pipefail
          image="system-images;android-${EMULATOR_API};${EMULATOR_TARGET};${EMULATOR_ARCH}"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install emulator "$image" > /dev/null
          revision() { sed -n 's/^Pkg\.Revision=//p' "$1/source.properties"; }
          emulator_version="$(revision "$ANDROID_HOME/emulator")"
          image_version="$(revision "$ANDROID_HOME/system-images/android-${EMULATOR_API}/${EMULATOR_TARGET}/${EMULATOR_ARCH}")"
          if [ -z "$emulator_version" ] || [ -z "$image_version" ] || [ -z "${ImageOS:-}" ]; then
            echo "error: could not read the emulator, system image or runner image version" >&2
            exit 1
          fi
          settings="$EMULATOR_PROFILE $EMULATOR_CORES $EMULATOR_RAM $EMULATOR_OPTIONS"
          settings_hash="$(printf '%s' "$settings" | sha256sum | cut -c1-12)"
          key="avd-v2-api${EMULATOR_API}-${EMULATOR_TARGET}-${EMULATOR_ARCH}-${ImageOS}"
          key="${key}-emulator-${emulator_version}-image-${image_version}-settings-${settings_hash}"
          echo "snapshot cache key: $key (settings: $settings)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # A booted emulator snapshot taken before any app is installed: tests still
      # start from a device with no Verceltics data, without a cold boot each run.
      - name: Restore the clean emulator snapshot
        id: avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-key.outputs.key }}

      - name: Create the emulator and save a clean boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          cores: ${{ env.EMULATOR_CORES }}
          ram-size: ${{ env.EMULATOR_RAM }}
          force-avd-creation: false
          emulator-boot-timeout: 300
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: bash scripts/ci/wait_for_emulator_idle.sh --compile

      # Cached right after it is made, before any app is installed or any test runs.
      # Only main saves it: pull requests and release runs reuse main's snapshot and
      # never write a second 4 GB copy.
      - name: Cache the clean emulator snapshot (main only)
        if: steps.avd-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-key.outputs.key }}

      - name: Run instrumentation and Compose UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          cores: ${{ env.EMULATOR_CORES }}
          ram-size: ${{ env.EMULATOR_RAM }}
          force-avd-creation: false
          emulator-boot-timeout: 300
          # -no-snapshot-save: the clean snapshot is reused, never overwritten by a test run.
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          working-directory: android
          script: bash "$RUNNER_TEMP/run-android-instrumentation.sh"

      - name: Retain instrumentation results and emulator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-instrumentation-reports-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-test-logs/
          if-no-files-found: warn
          retention-days: 7
