# Static analysis (SAST) with GitHub CodeQL.
#
# One job per language, each with a sparse checkout of the folders that language
# lives in, so no job downloads the store screenshots. Every job also checks out .github, which each language's analysis scans
# for workflow issues as well:
#
#   actions                .github/workflows/*.yml
#   javascript-typescript  web/ (site and Cloudflare Worker), services/,
#                          store/google-play/*.html
#   python                 scripts/, tests/
#
# A newer push to a pull request cancels that pull request's older run; pushes to
# main and the weekly scheduled run each keep their own run and are never cancelled.

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "18 7 * * 2"

permissions: read-all

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # The check names stay "Analyze (<language>, <build-mode>)" as before the sparse checkouts.
    name: Analyze (${{ matrix.language }}, ${{ matrix.build-mode }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            sparse-checkout: |
              /.github/
          - language: javascript-typescript
            build-mode: none
            sparse-checkout: |
              /.github/
              /web/
              /services/
              /store/google-play/*.html
          - language: python
            build-mode: none
            sparse-checkout: |
              /.github/
              /scripts/
              /tests/

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.sparse-checkout }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
