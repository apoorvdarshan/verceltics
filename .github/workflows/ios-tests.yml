name: iOS tests

# Unit (vercelticsTests) and UI (vercelticsUITests) tests on an iOS Simulator.
# Nothing here signs, archives, uploads, or touches App Store Connect.
on:
  pull_request:
    paths:
      - "ios/**"
      - "scripts/test-ios.sh"
      - "scripts/ci/check_ios_test_counts.py"
      - ".github/workflows/ios-tests.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/test-ios.sh"
      - "scripts/ci/check_ios_test_counts.py"
      - ".github/workflows/ios-tests.yml"
  workflow_dispatch:
  # ios-release.yml runs the same tests before a tagged release.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Pushes to main,
# manual runs, and release callers each keep their own run.
concurrency:
  group: ios-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-tests:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          # The app, its tests and project, and the test scripts; no web or marketing assets.
          sparse-checkout: |
            /ios/
            /scripts/test-ios.sh
            /scripts/ci/check_ios_test_counts.py

      - name: Cache pinned Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-test-packages
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('ios/**/Package.resolved') }}

      - name: Restore the compilation cache
        # Compiler outputs only, reused for unchanged files; every test still runs.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ios-compilation-cache
          key: ios-ccache-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ github.sha }}
          restore-keys: |
            ios-ccache-${{ runner.os }}-${{ runner.arch }}-xcode27-
      - name: Build and run unit and UI tests
        env:
          IOS_TEST_PACKAGES: ${{ github.workspace }}/.ios-test-packages
          IOS_TEST_DERIVED_DATA: ${{ runner.temp }}/ios-test-build
          IOS_COMPILATION_CACHE: ${{ runner.temp }}/ios-compilation-cache
          IOS_TEST_RESULTS: ${{ runner.temp }}/ios-test-results
        run: bash scripts/test-ios.sh

      - name: Retain test results and failure screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-test-results
          if-no-files-found: warn
          retention-days: 7
